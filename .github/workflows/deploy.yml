# GitHub Actions 工作流：自动部署到 GitHub Pages
name: Deploy to GitHub Pages

# 触发条件：当代码推送到 main 分支时触发
on:
  push:
    branches: [ main ]

# 工作流任务
jobs:
  # 构建和部署任务
  deploy:
    # 运行环境：最新版本的 Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # 步骤 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2: 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用 Node.js 20 版本
          cache: 'npm'        # 缓存 npm 依赖

      # 步骤 3: 安装依赖
      - name: Install dependencies
        run: npm install

      # 步骤 4: 构建项目
      - name: Build project
        run: npm run build

      # 步骤 5: 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 使用 GitHub Token 进行认证
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 部署的目录
          publish_dir: ./dist
          # 强制推送
          force_orphan: true
